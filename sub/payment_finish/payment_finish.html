<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>입덕볶이 - 로그인 및 회원가입</title>
  <!-- Pretendard 웹폰트 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    /* =========================================
       1. 디자인 토큰 및 기본 리셋
       ========================================= */
    :root {
      --primary-red: #FF3B30;
      --primary-orange: #FF6B2B;
      --primary-light: #FFF2F0;
      --bg-outer: #F5F6F8;
      --surface-white: #FFFFFF;
      --surface-gray: #F2F4F6;
      --text-main: #191F28;
      --text-sub: #4E5968;
      --text-muted: #8B95A1;
      --border-light: #E5E8EB;
      --success-green: #00A854;
      --kakao-yellow: #FEE500;
      --naver-green: #03C75A;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04);
      --shadow-cta: 0 6px 18px rgba(255, 59, 48, 0.26);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-outer);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* =========================================
       2. 모바일 앱 컨테이너 (최대 너비 500px)
       ========================================= */
    .app-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--surface-white);
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 36px;
    }

    /* =========================================
       3. 상단 고정 헤더 (56px Sticky Header)
       ========================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-gray);
    }

    .icon-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .icon-btn:hover {
      background-color: var(--surface-gray);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    /* =========================================
       4. 브랜드 웰컴 히어로 (Brand Welcome Hero)
       ========================================= */
    .welcome-hero {
      padding: 26px 24px 20px;
      text-align: center;
    }

    .mascot-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 24px;
      background: linear-gradient(145deg, #FFF5F2 0%, #FFE4DC 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(255, 59, 48, 0.14);
      border: 1px solid rgba(255, 59, 48, 0.12);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
    }

    .welcome-subcopy {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* =========================================
       5. 세그먼트 탭 스위처 (로그인 / 회원가입)
       ========================================= */
    .tab-wrap {
      padding: 0 20px;
      margin-bottom: 22px;
    }

    .segmented-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: var(--surface-gray);
      padding: 4px;
      border-radius: 14px;
    }

    .tab-btn {
      height: 40px;
      border: none;
      border-radius: 11px;
      background: transparent;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--surface-white);
      color: var(--primary-red);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* =========================================
       6. 공통 폼 & 입력창 스타일
       ========================================= */
    .auth-body {
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .view-panel {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .view-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-box {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 14px;
      border-radius: 13px;
      border: 1.5px solid var(--border-light);
      background-color: var(--surface-white);
      font-family: inherit;
      font-size: 14.5px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .text-input::placeholder {
      color: var(--text-muted);
    }

    .text-input:focus {
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1);
    }

    .text-input.error {
      border-color: var(--primary-red);
      background-color: #FFF9F8;
    }

    .text-input.valid {
      border-color: var(--success-green);
    }

    .input-action-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .input-action-btn:hover {
      background-color: var(--surface-gray);
      color: var(--text-sub);
    }

    .clear-btn {
      display: none;
    }

    .clear-btn.visible {
      display: flex;
    }

    /* 닉네임 중복확인 버튼 */
    .check-dup-btn {
      height: 48px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1.5px solid var(--border-light);
      background-color: var(--surface-gray);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .check-dup-btn:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
      background-color: var(--primary-light);
    }

    .check-dup-btn.verified {
      border-color: var(--success-green);
      background-color: #EEFDF3;
      color: var(--success-green);
    }

    .field-msg {
      font-size: 12px;
      margin-top: 5px;
      padding-left: 2px;
      min-height: 16px;
      color: var(--text-muted);
    }

    .field-msg.error {
      color: var(--primary-red);
      font-weight: 600;
    }

    .field-msg.success {
      color: var(--success-green);
      font-weight: 600;
    }

    /* =========================================
       7. 유틸리티 행 & 커스텀 체크박스
       ========================================= */
    .utility-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 20px;
      font-size: 13px;
    }

    .custom-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--text-sub);
      font-weight: 500;
    }

    .custom-check input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkmark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid #D1D6DB;
      background-color: var(--surface-white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .checkmark svg {
      width: 13px;
      height: 13px;
      stroke: #FFFFFF;
      stroke-width: 2.8;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.15s ease;
    }

    .custom-check input:checked + .checkmark {
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      border-color: transparent;
    }

    .custom-check input:checked + .checkmark svg {
      opacity: 1;
      transform: scale(1);
    }

    .find-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .text-link-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 2px;
    }

    .text-link-btn:hover {
      color: var(--primary-red);
      text-decoration: underline;
    }

    /* =========================================
       8. Primary CTA 버튼 & 로딩 스피너
       ========================================= */
    .primary-cta {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-cta);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .primary-cta:hover {
      box-shadow: 0 8px 22px rgba(255, 59, 48, 0.34);
    }

    .primary-cta:active {
      transform: scale(0.985);
    }

    .primary-cta:disabled {
      opacity: 0.78;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .primary-cta.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================
       9. 소셜 로그인 섹션
       ========================================= */
    .social-section {
      margin-top: 28px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--border-light);
    }

    .social-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      width: 100%;
      height: 48px;
      border-radius: 13px;
      border: none;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .social-btn:hover {
      filter: brightness(0.97);
    }

    .social-btn:active {
      transform: scale(0.985);
    }

    .btn-kakao {
      background-color: var(--kakao-yellow);
      color: #191919;
    }

    .btn-naver {
      background-color: var(--naver-green);
      color: #FFFFFF;
    }

    .btn-apple {
      background-color: var(--text-main);
      color: #FFFFFF;
    }

    /* =========================================
       10. 회원가입 약관 동의 박스
       ========================================= */
    .terms-box {
      background-color: var(--surface-gray);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 8px 0 18px;
    }

    .terms-all {
      padding-bottom: 11px;
      margin-bottom: 11px;
      border-bottom: 1px solid var(--border-light);
      font-weight: 700;
      color: var(--text-main);
      font-size: 14px;
    }

    .terms-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .terms-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .terms-view-link {
      font-size: 12px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    /* =========================================
       11. 하단 비회원 주문 링크
       ========================================= */
    .guest-footer {
      margin-top: 28px;
      text-align: center;
    }

    .guest-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .guest-link:hover {
      background-color: var(--surface-gray);
      color: var(--primary-red);
    }

    /* =========================================
       12. 모달 (아이디/비밀번호 찾기 & 완료 안내)
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(25, 31, 40, 0.5);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 500px;
      background-color: var(--surface-white);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 30px;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.14);
      animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .modal-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    /* 완료 안내 카드 (로그인/가입 성공 시 표시) */
    .success-banner {
      display: none;
      background-color: var(--primary-light);
      border: 1px solid rgba(255, 59, 48, 0.2);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
    }

    .success-banner.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .success-banner p {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .go-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      background-color: var(--primary-red);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background-color: rgba(25, 31, 40, 0.94);
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 400;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. 상단 고정 헤더 -->
    <header class="app-header">
      <button type="button" class="icon-btn" aria-label="뒤로가기" onclick="handleBack()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <h1 class="header-title" id="headerTitle">로그인</h1>

      <a href="tteokbokki_menu.html" class="icon-btn" aria-label="메뉴 홈으로 이동">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
    </header>

    <!-- 2. 브랜드 웰컴 히어로 -->
    <section class="welcome-hero">
      <div class="mascot-badge" aria-hidden="true">
        <!-- 커스텀 인라인 SVG 떡볶이 마스코트 뱃지 -->
        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 14C22 11 24.5 10 24.5 7" stroke="#FF6B2B" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M32 12C32 9 34.5 8 34.5 5" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M42 14C42 11 44.5 10 44.5 7" stroke="#FF6B2B" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="32" cy="34" rx="22" ry="8" fill="#FF3B30"/>
          <rect x="18" y="27" width="13" height="6.5" rx="3.25" transform="rotate(-12 18 27)" fill="#FFF8F0"/>
          <rect x="29" y="25" width="14" height="6.5" rx="3.25" transform="rotate(9 29 25)" fill="#FFFFFF"/>
          <rect x="23" y="32" width="13" height="6.5" rx="3.25" transform="rotate(3 23 32)" fill="#FFF8F0"/>
          <circle cx="42" cy="33" r="2.2" fill="#2ECC71"/>
          <path d="M10 34C10 46.15 19.85 55 32 55C44.15 55 54 46.15 54 34H10Z" fill="#191F28"/>
          <path d="M32 47.5C32 47.5 26.5 43.8 26.5 40.5C26.5 38.8 27.8 37.5 29.4 37.5C30.4 37.5 31.4 38 32 38.9C32.6 38 33.6 37.5 34.6 37.5C36.2 37.5 37.5 38.8 37.5 40.5C37.5 43.8 32 47.5 32 47.5Z" fill="#FF4B2B"/>
        </svg>
      </div>
      <div class="brand-name">
        입덕볶이
        <span class="brand-dot"></span>
      </div>
      <p class="welcome-subcopy">한 입의 설렘, 입덕볶이에 오신 걸 환영해요!</p>
    </section>

    <!-- 3. 탭 스위처 (로그인 / 회원가입) -->
    <div class="tab-wrap">
      <div class="segmented-tabs" role="tablist">
        <button type="button" class="tab-btn active" role="tab" id="tabLogin" aria-selected="true" onclick="switchTab('login')">로그인</button>
        <button type="button" class="tab-btn" role="tab" id="tabSignup" aria-selected="false" onclick="switchTab('signup')">회원가입</button>
      </div>
    </div>

    <!-- 4. 메인 폼 영역 -->
    <main class="auth-body">
      <!-- [VIEW A] 로그인 뷰 -->
      <section class="view-panel active" id="loginView" aria-labelledby="tabLogin">
        <form id="loginForm" novalidate onsubmit="handleLoginSubmit(event)">
          <!-- 이메일 또는 아이디 -->
          <div class="field-group">
            <label class="field-label" for="loginId">이메일 또는 아이디</label>
            <div class="input-box">
              <input
                type="text"
                id="loginId"
                class="text-input"
                placeholder="example@ipdeokbokki.co.kr"
                autocomplete="username"
                oninput="toggleClearBtn('loginId', 'clearLoginId'); clearFieldError('loginId', 'loginIdMsg')"
              />
              <button
                type="button"
                class="input-action-btn clear-btn"
                id="clearLoginId"
                aria-label="입력 지우기"
                onclick="clearInput('loginId', 'clearLoginId', 'loginIdMsg')"
              >

  <!-- 아이디 / 비밀번호 찾기 바텀시트 모달 -->
  <div class="modal-backdrop" id="findModal" onclick="closeFindModalOnBackdrop(event)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title" id="findModalTitle">아이디 찾기</h2>
        <button type="button" class="icon-btn" aria-label="닫기" onclick="closeFindModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

          </svg>

      </div>

      <form onsubmit="submitFindForm(event)">
        <div class="field-group">
          <input type="email" id="findEmailInput" class="text-input" placeholder="가입한 이메일 입력 (예: user@email.com)" required />
        </div>
        <button type="submit" class="primary-cta">안내 메일 발송하기</button>
      </form>
    </div>
  </div>

  <!-- 하단 토스트 메시지 -->
  <div class="toast" id="toastMsg">안내 메시지</div>

  <script>
    let isNickVerified = false;
    let toastTimer = null;
    const toastEl = document.getElementById('toastMsg');

    // =========================================
    // 1. 탭 전환 (로그인 <-> 회원가입)
    // =========================================
    function switchTab(mode) {
      const isLogin = mode === 'login';
      document.getElementById('headerTitle').textContent = isLogin ? '로그인' : '회원가입';

      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabLogin').setAttribute('aria-selected', String(isLogin));

      document.getElementById('tabSignup').classList.toggle('active', !isLogin);
      document.getElementById('tabSignup').setAttribute('aria-selected', String(!isLogin));

      document.getElementById('loginView').classList.toggle('active', isLogin);
      document.getElementById('signupView').classList.toggle('active', !isLogin);
    }

    // =========================================
    // 2. 입력창 유틸리티 (지우기 버튼 & 비밀번호 눈 아이콘)
    // =========================================
    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      btn.classList.toggle('visible', input.value.length > 0);
    }

    function clearInput(inputId, btnId, msgId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input) {
        input.value = '';
        input.focus();
      }
      if (btn) btn.classList.remove('visible');
      if (msgId) clearFieldError(inputId, msgId);
    }

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      btnEl.innerHTML = isPassword
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
             <line x1="1" y1="1" x2="23" y2="23"></line>
           </svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
             <circle cx="12" cy="12" r="3"></circle>
           </svg>`;
    }

    function setFieldState(inputId, msgId, state, text) {
      const input = document.getElementById(inputId);
      const msg = document.getElementById(msgId);
      if (input) {
        input.classList.remove('error', 'valid');
        if (state === 'error') input.classList.add('error');
        if (state === 'success') input.classList.add('valid');
      }
      if (msg) {
        msg.classList.remove('error', 'success');
        if (state === 'error') msg.classList.add('error');
        if (state === 'success') msg.classList.add('success');
        msg.textContent = text;
      }
    }

    function clearFieldError(inputId, msgId) {
      setFieldState(inputId, msgId, '', '');
    }

    // =========================================
    // 3. 로그인 폼 검증 & 제출 시뮬레이션
    // =========================================
    function handleLoginSubmit(event) {
      event.preventDefault();
      const idVal = document.getElementById('loginId').value.trim();
      const pwVal = document.getElementById('loginPw').value.trim();
      let isValid = true;

      if (!idVal) {
        setFieldState('loginId', 'loginIdMsg', 'error', '이메일 또는 아이디를 입력해 주세요.');
        isValid = false;
      } else if (idVal.length < 3) {
        setFieldState('loginId', 'loginIdMsg', 'error', '올바른 이메일 또는 아이디 형식을 입력해 주세요.');
        isValid = false;
      }

      if (!pwVal) {
        setFieldState('loginPw', 'loginPwMsg', 'error', '비밀번호를 입력해 주세요.');
        isValid = false;
      } else if (pwVal.length < 6) {
        setFieldState('loginPw', 'loginPwMsg', 'error', '비밀번호는 6자 이상이어야 합니다.');
        isValid = false;
      }

      if (!isValid) return;

      const btn = document.getElementById('loginSubmitBtn');
      const btnText = btn.querySelector('.btn-text');
      btn.classList.add('loading');
      btn.disabled = true;
      btnText.textContent = '로그인 중...';

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        btnText.textContent = '로그인하기';
        document.getElementById('loginSuccessBanner').classList.add('show');
        showToast('환영합니다! 입덕볶이 로그인이 완료되었습니다 🌶️');
      }, 950);
    }

    function handleSocialLogin(provider) {
      showToast(`${provider} 계정으로 간편 로그인을 진행합니다...`);
      setTimeout(() => {
        document.getElementById('loginSuccessBanner').classList.add('show');
        showToast(`환영합니다! ${provider} 로그인이 완료되었습니다 🌶️`);
      }, 850);
    }

    // =========================================
    // 4. 회원가입 실시간 검증 & 약관 동의
    // =========================================
    function resetNickVerification() {
      isNickVerified = false;
      const btn = document.getElementById('nickCheckBtn');
      btn.classList.remove('verified');
      btn.textContent = '중복확인';
      clearFieldError('signupNick', 'signupNickMsg');
    }

    function checkNicknameDuplicate() {
      const nickInput = document.getElementById('signupNick');
      const val = nickInput.value.trim();
      if (val.length < 2) {
        setFieldState('signupNick', 'signupNickMsg', 'error', '닉네임은 2자 이상 입력해 주세요.');
        nickInput.focus();
        return;
      }
      if (val === '입덕볶이' || val === '관리자') {
        setFieldState('signupNick', 'signupNickMsg', 'error', '이미 사용 중인 닉네임입니다. 다른 이름을 입력해 주세요.');
        isNickVerified = false;
        return;
      }
      isNickVerified = true;
      const btn = document.getElementById('nickCheckBtn');
      btn.classList.add('verified');
      btn.textContent = '사용가능 ✓';
      setFieldState('signupNick', 'signupNickMsg', 'success', '멋진 닉네임이에요! 사용 가능합니다.');
    }

    function validateSignupPassword() {
      const pw = document.getElementById('signupPw').value;
      const hasLetter = /[a-zA-Z]/.test(pw);
      const hasNumber = /[0-9]/.test(pw);

      if (!pw) {
        setFieldState('signupPw', 'signupPwMsg', '', '영문, 숫자 포함 8자 이상 입력해 주세요');
      } else if (pw.length < 8 || !hasLetter || !hasNumber) {
        setFieldState('signupPw', 'signupPwMsg', 'error', '영문과 숫자를 모두 포함해 8자 이상 입력해 주세요.');
      } else {
        setFieldState('signupPw', 'signupPwMsg', 'success', '안전한 비밀번호입니다 ✓');
      }

      if (document.getElementById('signupPwConfirm').value.length > 0) {
        validatePasswordMatch();
      }
    }

    function validatePasswordMatch() {
      const pw = document.getElementById('signupPw').value;
      const pwConfirm = document.getElementById('signupPwConfirm').value;

      if (!pwConfirm) {
        clearFieldError('signupPwConfirm', 'signupPwConfirmMsg');
        return false;
      }
      if (pw !== pwConfirm) {
        setFieldState('signupPwConfirm', 'signupPwConfirmMsg', 'error', '비밀번호가 일치하지 않습니다.');
        return false;
      }
      setFieldState('signupPwConfirm', 'signupPwConfirmMsg', 'success', '비밀번호가 일치합니다 ✓');
      return true;
    }

    function toggleAllAgreements(checked) {
      document.querySelectorAll('.agree-item').forEach((item) => {
        item.checked = checked;
      });
    }

    function syncAgreeAll() {
      const items = Array.from(document.querySelectorAll('.agree-item'));
      document.getElementById('agreeAll').checked = items.every((item) => item.checked);
    }

    function handleSignupSubmit(event) {
      event.preventDefault();
      const nick = document.getElementById('signupNick').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pw = document.getElementById('signupPw').value;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const pwValid = pw.length >= 8 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw);

      let valid = true;

      if (nick.length < 2) {
        setFieldState('signupNick', 'signupNickMsg', 'error', '닉네임을 2자 이상 입력해 주세요.');
        valid = false;
      } else if (!isNickVerified) {
        setFieldState('signupNick', 'signupNickMsg', 'error', '닉네임 중복확인을 눌러주세요.');
        valid = false;
      }

      if (!emailRegex.test(email)) {
        setFieldState('signupEmail', 'signupEmailMsg', 'error', '올바른 이메일 주소를 입력해 주세요.');
        valid = false;
      }

      if (!pwValid) {
        setFieldState('signupPw', 'signupPwMsg', 'error', '영문, 숫자 포함 8자 이상 입력해 주세요.');
        valid = false;
      }

      if (!validatePasswordMatch()) {
        valid = false;
      }

      if (!valid) return;

      const reqAgreements = Array.from(document.querySelectorAll('.required-agree'));
      if (!reqAgreements.every((cb) => cb.checked)) {
        showToast('필수 약관에 모두 동의해 주세요!');
        return;
      }

      const btn = document.getElementById('signupSubmitBtn');
      const btnText = btn.querySelector('.btn-text');
      btn.classList.add('loading');
      btn.disabled = true;
      btnText.textContent = '가입 처리 중...';

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        btnText.textContent = '가입하고 첫 주문 3,000원 쿠폰 받기';
        document.getElementById('signupSuccessBanner').classList.add('show');
        showToast(`환영합니다, ${nick}님! 입덕볶이 회원가입이 완료되었습니다 🌶️`);
      }, 1000);
    }

    // =========================================
    // 5. 아이디/비밀번호 찾기 모달 & 공통 유틸
    // =========================================
    function openFindModal(type) {
      const isId = type === 'id';
      document.getElementById('findModalTitle').textContent = isId ? '아이디 찾기' : '비밀번호 재설정';
      document.getElementById('findModalDesc').textContent = isId
        ? '가입 시 등록한 이메일 주소를 입력하시면 아이디 안내 메일을 보내드립니다.'
        : '가입한 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.';
      document.getElementById('findEmailInput').value = '';
      document.getElementById('findModal').classList.add('open');
    }

    function closeFindModal() {
      document.getElementById('findModal').classList.remove('open');
    }

    function closeFindModalOnBackdrop(event) {
      if (event.target.id === 'findModal') closeFindModal();
    }

    function submitFindForm(event) {
      event.preventDefault();
      const email = document.getElementById('findEmailInput').value.trim();
      if (!email) return;
      closeFindModal();
      showToast(`${email}로 안내 메일을 발송했어요!`);
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'tteokbokki_menu.html';
      }
    }
  </script>
</body>
</html>

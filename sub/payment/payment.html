<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>입덕볶이 - 입덕 커뮤니티</title>
  <!-- Pretendard 웹폰트 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* =========================================
       1. 디자인 토큰 및 기본 리셋
       ========================================= */
    :root {
      --primary-red: #FF3B30;
      --primary-orange: #FF6B2B;
      --primary-light: #FFF2F0;
      --bg-outer: #F2F3F5;
      --bg-app: #F8F9FA;
      --surface-white: #FFFFFF;
      --text-main: #191F28;
      --text-sub: #4E5968;
      --text-muted: #8B95A1;
      --border-light: #F2F4F6;
      --border-medium: #E5E8EB;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.035);
      --shadow-float: 0 6px 20px rgba(255, 59, 48, 0.34);
      --shadow-nav: 0 -2px 12px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-outer);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* =========================================
       2. 모바일 앱 컨테이너 (최대 너비 500px)
       ========================================= */
    .app-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-app);
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 110px; /* 하단 탭바 + 플로팅 버튼 여백 */
    }

    /* =========================================
       3. 상단 고정 헤더 (Sticky Header)
       ========================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: background-color 0.2s ease, transform 0.1s ease;
      position: relative;
    }

    .icon-btn:hover {
      background-color: var(--border-light);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .noti-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--primary-red);
    }

    /* 검색 인풋 확장 바 */
    .search-bar-wrap {
      display: none;
      background-color: var(--surface-white);
      padding: 8px 16px 10px;
      border-bottom: 1px solid var(--border-light);
    }

    .search-bar-wrap.open {
      display: block;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background-color: var(--bg-app);
      border: 1px solid var(--border-medium);
      border-radius: 12px;
      padding: 0 12px;
      height: 38px;
      gap: 8px;
    }

    .search-input-box input {
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }

    /* =========================================
       4. 카테고리 필터 탭 (가로 스크롤, Sticky)
       ========================================= */
    .category-nav {
      position: sticky;
      top: 56px;
      z-index: 90;
      background-color: var(--surface-white);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .category-tab {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--border-medium);
      background-color: var(--surface-white);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-tab:hover {
      border-color: #D1D6DB;
      color: var(--text-main);
    }

    .category-tab.active {
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(255, 59, 48, 0.24);
    }

    /* =========================================
       5. 상단 고정 공지 배너
       ========================================= */
    .notice-banner-wrap {
      padding: 12px 16px 4px;
    }

    .notice-banner {
      width: 100%;
      background-color: var(--primary-light);
      border: 1px solid rgba(255, 59, 48, 0.16);
      border-radius: 14px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .notice-banner:hover {
      background-color: #FFE7E3;
    }

    .notice-banner:active {
      transform: scale(0.99);
    }

    .notice-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notice-tag {
      color: var(--primary-red);
      font-weight: 800;
      margin-right: 4px;
    }

    .notice-arrow {
      color: var(--primary-red);
      flex-shrink: 0;
    }

    /* =========================================
       6. 피드형 게시글 리스트 (카드 UI)
       ========================================= */
    .feed-section {
      padding: 10px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post-card {
      background-color: var(--surface-white);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
      transition: transform 0.18s ease;
    }

    /* 작성자 프로필 영역 */
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .av-coral { background: linear-gradient(135deg, #FFE4E1, #FFC7BF); }
    .av-mint { background: linear-gradient(135deg, #E3F9ED, #C2F0D7); }
    .av-yellow { background: linear-gradient(135deg, #FFF5D6, #FFE39E); }
    .av-purple { background: linear-gradient(135deg, #EFE9FC, #DACDF8); }
    .av-blue { background: linear-gradient(135deg, #E5F4FF, #C2E4FF); }

    .author-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .author-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .author-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .rank-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--primary-light);
      color: var(--primary-red);
    }

    .rank-badge.gold {
      background-color: #FFF6DB;
      color: #D97706;
    }

    .rank-badge.mint {
      background-color: #E8F8F0;
      color: #0D9459;
    }

    .post-time {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .post-cat-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background-color: var(--bg-app);
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
    }

    /* 게시글 제목 & 본문 */
    .post-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .post-body {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.55;
      word-break: keep-all;
      margin-bottom: 14px;
      white-space: pre-line;
    }

    /* CSS 파스텔 비주얼 카드 & 주문 메뉴 태그 칩 */
    .visual-card {
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .vc-basil { background: linear-gradient(135deg, #EEFBF3 0%, #D4F3E1 100%); }
    .vc-mala { background: linear-gradient(135deg, #FFF0EB 0%, #FFD4C6 100%); }
    .vc-night { background: linear-gradient(135deg, #F3EFFE 0%, #E0D5FC 100%); }
    .vc-toowoomba { background: linear-gradient(135deg, #FFF8E6 0%, #FFE8B3 100%); }
    .vc-classic { background: linear-gradient(135deg, #FFEBEB 0%, #FFCECE 100%); }

    .visual-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1;
    }

    .visual-caption {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .menu-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-red);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      width: fit-content;
    }

    .visual-emoji-group {
      font-size: 38px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
      flex-shrink: 0;
      letter-spacing: -4px;
    }

    /* 하단 인터랙션 바 */
    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .interact-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .interact-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background-color: var(--bg-app);
    }

    .action-btn.liked {
      color: var(--primary-red);
      background-color: var(--primary-light);
    }

    .action-btn.liked svg {
      fill: var(--primary-red);
      stroke: var(--primary-red);
      animation: popHeart 0.28s ease;
    }

    .action-btn.bookmarked {
      color: var(--primary-orange);
    }

    .action-btn.bookmarked svg {
      fill: var(--primary-orange);
      stroke: var(--primary-orange);
    }

    @keyframes popHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }

    /* =========================================
       7. 인라인 댓글 펼침 영역 (Comment Drawer)
       ========================================= */
    .comment-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-medium);
    }

    .comment-drawer.open {
      display: block;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .comment-item {
      background-color: var(--bg-app);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12.5px;
    }

    .comment-item-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .comment-author {
      font-weight: 700;
      color: var(--text-main);
    }

    .comment-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .comment-text {
      color: var(--text-sub);
      word-break: keep-all;
    }

    .comment-form {
      display: flex;
      gap: 6px;
    }

    .comment-input {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-medium);
      background-color: var(--surface-white);
      padding: 0 12px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-main);
      outline: none;
    }

    .comment-input:focus {
      border-color: var(--primary-red);
    }

    .comment-submit {
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      background-color: var(--primary-red);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 빈 검색 결과 안내 */
    .empty-state {
      display: none;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* =========================================
       8. 우측 하단 플로팅 글쓰기 버튼 (FAB)
       ========================================= */
    .fab-wrap {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      padding-right: 16px;
      z-index: 95;
    }

    .fab-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-float);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .fab-btn:hover {
      transform: translateY(-2px);
    }

    .fab-btn:active {
      transform: scale(0.95);
    }

    /* =========================================
       9. 하단 고정 네비게이션 바 (Bottom Tab Bar)
       ========================================= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 62px;
      background-color: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-light);
      box-shadow: var(--shadow-nav);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-item:hover {
      color: var(--text-sub);
    }

    .nav-item.active {
      color: var(--primary-red);
      font-weight: 700;
    }

    /* =========================================
       10. 모달 (새 글 쓰기 & 공지 상세)
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(25, 31, 40, 0.52);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 500px;
      background-color: var(--surface-white);
      border-radius: 24px 24px 0 0;
      padding: 22px 20px 28px;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.14);
      animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-select,
    .form-input,
    .form-textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-medium);
      background-color: var(--bg-app);
      padding: 11px 13px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-select:focus,
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary-red);
      background-color: var(--surface-white);
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .submit-post-btn {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 6px 16px rgba(255, 59, 48, 0.25);
    }

    /* 공지 상세 카드 스타일 */
    .notice-detail-box {
      background-color: var(--primary-light);
      border-radius: 16px;
      padding: 16px;
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .notice-detail-box strong {
      color: var(--primary-red);
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 132px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background-color: rgba(25, 31, 40, 0.92);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.24s ease;
      z-index: 400;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. 상단 고정 헤더 -->
    <header class="app-header">
      <button type="button" class="icon-btn" aria-label="뒤로가기" onclick="handleBack()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <h1 class="header-title">입덕 커뮤니티</h1>

      <div class="header-actions">
        <button type="button" class="icon-btn" aria-label="게시글 검색" onclick="toggleSearchBar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button type="button" class="icon-btn" aria-label="알림" onclick="showToast('새 댓글 알림 2건이 도착했어요!')">

    function renderFeed() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = posts.filter((post) => {
        // 카테고리 필터
        const matchCat =
          currentCategory === 'all' ||
          (currentCategory === 'popular' && post.popular) ||
          post.category === currentCategory;

        // 검색어 필터
        const matchSearch =
          !keyword ||
          post.title.toLowerCase().includes(keyword) ||
          post.body.toLowerCase().includes(keyword) ||
          post.author.toLowerCase().includes(keyword) ||
          (post.visual && post.visual.menuTag.toLowerCase().includes(keyword));

        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        feedContainer.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      feedContainer.innerHTML = filtered

          const visualHTML = post.visual
            ? `
              <div class="visual-card ${post.visual.theme}">
                <div class="visual-info">
                  <span class="visual-caption">${escapeHTML(post.visual.caption)}</span>
                  <span class="menu-chip">🛒 ${escapeHTML(post.visual.menuTag)}</span>
                </div>
                <div class="visual-emoji-group" aria-hidden="true">${post.visual.emojis}</div>
              </div>
            `
            : '';

          const commentsHTML = post.comments
            .map(
              (c) => `
              <div class="comment-item">
                <div class="comment-item-top">
                  <span class="comment-author">${escapeHTML(c.author)}</span>
                  <span class="comment-time">${escapeHTML(c.time)}</span>
                </div>
                <p class="comment-text">${escapeHTML(c.text)}</p>
              </div>
            `
            )
            .join('');

            <article class="post-card" id="post-${post.id}">

                  <button type="button" class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span>${post.likes}</span>
                  </button>

                  <button type="button" class="action-btn" onclick="toggleComments(${post.id})">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    <span>${post.comments.length}</span>
                  </button>
                </div>

                <div class="interact-right">
                  <button type="button" class="action-btn ${post.bookmarked ? 'bookmarked' : ''}" aria-label="북마크" onclick="toggleBookmark(${post.id})">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                  </button>
                  <button type="button" class="action-btn" aria-label="공유하기" onclick="sharePost('${escapeHTML(post.title)}')">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="18" cy="5" r="3"></circle>
                      <circle cx="6" cy="12" r="3"></circle>
                      <circle cx="18" cy="19" r="3"></circle>
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- 인라인 댓글 펼침 영역 -->
              <div class="comment-drawer" id="drawer-${post.id}">
                <div class="comment-list">
                  ${commentsHTML || '<p style="font-size:12px; color:#8B95A1; padding:4px 2px;">아직 댓글이 없어요. 첫 댓글을 남겨보세요!</p>'}
                </div>
                <form class="comment-form" onsubmit="addComment(event, ${post.id})">
                  <input type="text" class="comment-input" id="c-input-${post.id}" placeholder="따뜻한 댓글을 남겨주세요..." required />
                  <button type="submit" class="comment-submit">등록</button>
                </form>
              </div>
            </article>
          `;
        })
        .join('');
    }

    // XSS 방지용 간단한 이스케이프 헬퍼
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================
    // 3. 인터랙션 핸들러 (좋아요, 댓글, 북마크, 공유)
    // =========================================
    function toggleLike(postId) {
      const post = posts.find((p) => p.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      renderFeed();
    }

    function toggleBookmark(postId) {
      const post = posts.find((p) => p.id === postId);
      if (!post) return;
      post.bookmarked = !post.bookmarked;
      renderFeed();
      showToast(post.bookmarked ? '꿀조합 보관함에 저장했어요!' : '보관함에서 해제했어요');
    }

    function toggleComments(postId) {
      const drawer = document.getElementById(`drawer-${postId}`);
      if (drawer) {
        drawer.classList.toggle('open');
      }
    }

    function addComment(event, postId) {
      event.preventDefault();
      const inputEl = document.getElementById(`c-input-${postId}`);
      const text = inputEl.value.trim();
      if (!text) return;

      const post = posts.find((p) => p.id === postId);
      if (!post) return;

      post.comments.push({
        author: '나(입덕러)',
        time: '방금 전',
        text
      });

      renderFeed();
      // 방금 댓글 단 게시글의 댓글창은 열린 상태 유지
      const reopenedDrawer = document.getElementById(`drawer-${postId}`);
      if (reopenedDrawer) reopenedDrawer.classList.add('open');
      showToast('댓글이 등록되었어요!');
    }

    function sharePost(title) {
      const tempInput = document.createElement('input');
      tempInput.value = `[입덕 커뮤니티] ${title}`;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast('게시글 링크가 클립보드에 복사되었어요!');
    }

    // =========================================
    // 4. 카테고리 필터 & 검색 토글
    // =========================================
    document.querySelectorAll('.category-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        renderFeed();
      });
    });

    function toggleSearchBar() {
      const wrap = document.getElementById('searchBarWrap');
      wrap.classList.toggle('open');
      if (wrap.classList.contains('open')) {
        document.getElementById('searchInput').focus();
      } else {
        document.getElementById('searchInput').value = '';
        renderFeed();
      }
    }

    // =========================================
    // 5. 모달 제어 & 새 글 등록
    // =========================================
    function openWriteModal() {
      document.getElementById('writeModal').classList.add('open');
    }

    function openNoticeModal() {
      document.getElementById('noticeModal').classList.add('open');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    function closeModalOnBackdrop(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    }

    function submitNewPost(event) {
      event.preventDefault();

      const category = document.getElementById('postCategory').value;
      const menuTag = document.getElementById('postMenuTag').value;
      const title = document.getElementById('postTitle').value.trim();
      const body = document.getElementById('postContent').value.trim();

      if (!title || !body) return;

      const catLabelMap = {
        recipe: '🥄 꿀조합 레시피',
        photo: '📸 먹방 인증',
        chat: '💬 자유수다'
      };

      const visualThemeMap = {
        '바질 페스토 크림 떡볶이': { theme: 'vc-basil', emojis: '🌿🥘🧀', caption: '향긋한 바질 페스토 크림 인증!' },
        '마라로제 떡볶이': { theme: 'vc-mala', emojis: '🔥🥘🧃', caption: '얼얼매콤 마라로제 중독 후기!' },
        '오리지널 매콤 떡볶이': { theme: 'vc-classic', emojis: '🥘🌶️🍢', caption: '역시 기본이 최고! 오리지널 매콤' },
        '꾸덕 투움바 떡볶이': { theme: 'vc-toowoomba', emojis: '🧀🍤🍄', caption: '꾸덕한 투움바 크림 & 통새우' },
        '모듬 튀김 & 찰순대 세트': { theme: 'vc-night', emojis: '🍤🍢🍙', caption: '바삭 모듬튀김과 찰순대 조합' }
      };

      const selectedVisual = menuTag && visualThemeMap[menuTag]
        ? {
            theme: visualThemeMap[menuTag].theme,
            caption: visualThemeMap[menuTag].caption,
            emojis: visualThemeMap[menuTag].emojis,
            menuTag
          }
        : null;

      const newPost = {
        id: Date.now(),
        author: '입덕러_나',
        avatar: '🥘',
        avatarClass: 'av-coral',
        rank: '열혈 입덕러',
        rankClass: '',
        time: '방금 전',
        category,
        categoryLabel: catLabelMap[category] || '💬 자유수다',
        popular: true,
        title,
        body,
        visual: selectedVisual,
        likes: 1,
        liked: true,
        bookmarked: false,
        comments: []
      };

      posts.unshift(newPost);

      // 전체 탭으로 전환해 새 글 즉시 확인
      currentCategory = 'all';
      document.querySelectorAll('.category-tab').forEach((t) => t.classList.remove('active'));
      document.querySelector('.category-tab[data-category="all"]').classList.add('active');

      renderFeed();
      document.getElementById('writeForm').reset();
      closeModal('writeModal');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('새 게시글이 커뮤니티에 등록되었어요!');
    }

    // =========================================
    // 6. 토스트 및 뒤로가기
    // =========================================
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2200);
    }

    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'tteokbokki_menu.html';
      }
    }

    // 초기 피드 렌더링 실행
    renderFeed();
  </script>
</body>
</html>

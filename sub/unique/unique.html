<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>입덕볶이 | 독특한 시그니처 메뉴 컬렉션</title>
    <!-- Noto Sans KR 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ==================== 1. 디자인 토큰 및 리셋 ==================== */
        :root {
            --bg-outer: #F4F5F7;
            --bg-app: #FFFFFF;
            --text-primary: #191919;
            --text-secondary: #555558;
            --text-muted: #8E8E93;
            --brand-red: #E62E2D;
            --brand-red-soft: #FFF0F1;
            --brand-red-border: #FFC2C7;
            --brand-orange: #FF6B00;
            --brand-orange-soft: #FFF0E6;
            --brand-yellow: #FFE600;
            --star-gold: #FFB800;
            --thumb-cream: #FDF7F0;
            --border-light: #F0F0F2;
            --pill-bg: #F4F5F7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-outer);
            color: var(--text-primary);
            line-height: 1.45;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* ==================== 2. 모바일 앱 컨테이너 (480px) ==================== */
        .app-shell {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-app);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 28px rgba(0, 0, 0, 0.06);
            padding-bottom: 36px;
            overflow-x: hidden;
        }

        /* ==================== 3. 상단 스티키 헤더 ==================== */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 40;
            height: 56px;
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            color: var(--text-primary);
            position: relative;
            transition: background-color 0.15s ease;
        }

        .icon-btn:hover {
            background-color: var(--pill-bg);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header-flame-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: var(--brand-red-soft);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-badge {
            position: absolute;
            top: 2px;
            right: 1px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 999px;
            background-color: var(--brand-red);
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #FFFFFF;
        }

        /* ==================== 4. 히어로 프로모션 배너 & 플로팅 쿠폰 ==================== */
        .hero-wrapper {
            position: relative;
            margin-bottom: 44px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #FF3B30 0%, #FF6B00 100%);
            padding: 18px 18px 54px 18px;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        /* 장식용 반투명 원형 오버레이 */
        .hero-deco-circle-1 {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            top: -40px;
            right: -30px;
            pointer-events: none;
        }

        .hero-deco-circle-2 {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 230, 0, 0.1);
            bottom: -30px;
            left: 25%;
            pointer-events: none;
        }

        .hero-top-pills {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .pill-dark-glass {
            background: rgba(25, 25, 25, 0.28);
            backdrop-filter: blur(4px);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .pill-light-glass {
            background: rgba(255, 255, 255, 0.22);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-variant-numeric: tabular-nums;
        }

        .hero-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .hero-subtitle {
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
            margin-bottom: 4px;
        }

        .hero-headline {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.03em;
        }

        .hero-headline span {
            color: var(--brand-yellow);
            display: block;
        }

        .hero-pan-art {
            width: 68px;
            height: 68px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }

        /* 플로팅 화이트 쿠폰 카드 */
        .floating-coupon-card {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: -32px;
            z-index: 10;
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 13px 15px;
            box-shadow: 0 6px 20px rgba(25, 25, 25, 0.08);
            border: 1px solid #EFEFF1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .coupon-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .coupon-ticket-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background-color: var(--brand-red-soft);
            color: var(--brand-red);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .coupon-title {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .coupon-sub {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .coupon-btn {
            background-color: var(--brand-red);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .coupon-btn.issued {
            background-color: #191919;
            color: #FFE600;
        }

        /* ==================== 5. 카테고리 필터 탭 & 정렬 바 ==================== */
        .filter-section {
            padding: 4px 16px 0 16px;
        }

        .category-scroll {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 4px;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            background-color: var(--pill-bg);
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .cat-pill.active {
            background-color: #191919;
            color: #FFFFFF;
        }

        .sort-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 2px 10px 2px;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .sort-count strong {
            color: var(--text-primary);
            font-weight: 800;
        }

        .sort-select {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
            padding-right: 2px;
        }

        /* ==================== 6. 가로형 메뉴 카드 리스트 ==================== */
        .menu-list {
            padding: 2px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 13px;
            display: flex;
            gap: 13px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .menu-card:active {
            transform: scale(0.99);
        }

        /* 첫 번째 시그니처 강조 카드 */
        .menu-card.featured {
            border: 1.5px solid var(--brand-red-border);
            box-shadow: 0 4px 14px rgba(230, 46, 45, 0.06);
        }

        /* 좌측 104x104 크림 썸네일 박스 */
        .thumb-box {
            width: 104px;
            height: 104px;
            border-radius: 14px;
            background-color: var(--thumb-cream);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(25, 25, 25, 0.04);
        }

        .thumb-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            background-color: var(--brand-red);
            color: #FFFFFF;
            font-size: 10.5px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            letter-spacing: -0.02em;
            box-shadow: 0 2px 6px rgba(230, 46, 45, 0.25);
        }

        /* 우측 콘텐츠 영역 */
        .card-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
        }

        .cat-tag {
            background-color: var(--brand-orange-soft);
            color: var(--brand-orange);
            font-size: 10.5px;
            font-weight: 800;
            padding: 2.5px 7px;
            border-radius: 6px;
        }

        .spice-meter {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .mild-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .card-desc {
            font-size: 12.5px;
            color: #767678;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .card-rating .star {
            color: var(--star-gold);
            font-size: 12.5px;
        }

        .card-rating .reviews {
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-price {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .detail-cta-btn {
            background-color: var(--brand-red-soft);
            color: var(--brand-red);
            border: none;
            border-radius: 8px;
            padding: 6px 11px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .menu-card:hover .detail-cta-btn {
            background-color: #FFE0E2;
        }

        /* ==================== 7. 메뉴 상세정보 바텀 시트 모달 ==================== */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: rgba(25, 25, 25, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .sheet-backdrop.open {
            display: flex;
        }

        .bottom-sheet {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            background-color: #FFFFFF;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle-bar {
            padding: 10px 0 4px 0;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .sheet-handle {
            width: 38px;
            height: 4px;
            border-radius: 999px;
            background-color: #DCDCE0;
        }

        .sheet-close-btn {
            position: absolute;
            right: 16px;
            top: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: var(--pill-bg);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sheet-scroll-body {
            padding: 8px 20px 24px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .sheet-hero-visual {
            background-color: var(--thumb-cream);
            border-radius: 18px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            border: 1px solid rgba(25, 25, 25, 0.05);
        }

        .sheet-visual-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--brand-red);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 8px;
        }

        .sheet-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .sheet-menu-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .sheet-story {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 14px;
        }

        /* 시크릿 레시피 & 식감/페어링 정보 박스 */
        .recipe-card {
            background-color: #FAFAFB;
            border: 1px solid #ECECEF;
            border-radius: 14px;
            padding: 13px 14px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12.5px;
        }

        .recipe-row {
            display: flex;
            gap: 8px;
        }

        .recipe-label {
            width: 72px;
            flex-shrink: 0;
            font-weight: 800;
            color: var(--text-primary);
        }

        .recipe-val {
            color: var(--text-secondary);
            flex: 1;
        }

        .pairing-highlight {
            background-color: var(--brand-orange-soft);
            color: #C94A00;
            padding: 8px 11px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* 옵션 그룹 스타일 */
        .option-group {
            margin-bottom: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }

        .option-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .option-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .req-badge {
            font-size: 11px;
            font-weight: 800;
            color: var(--brand-red);
            background-color: var(--brand-red-soft);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .opt-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background-color: var(--pill-bg);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 13px;
            border: 1.5px solid #EAEAEF;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-item.selected {
            border-color: var(--brand-red);
            background-color: #FFF9F9;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13.5px;
            font-weight: 600;
        }

        .option-left input {
            accent-color: var(--brand-red);
            width: 16px;
            height: 16px;
        }

        .option-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* 영양/알레르기 박스 */
        .nutrition-box {
            background-color: var(--pill-bg);
            border-radius: 12px;
            padding: 12px;
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* 바텀 시트 하단 고정 액션 바 */
        .sheet-footer {
            padding: 12px 16px 18px 16px;
            background-color: #FFFFFF;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-stepper {
            display: flex;
            align-items: center;
            border: 1.5px solid #E2E2E6;
            border-radius: 12px;
            height: 48px;
            padding: 0 4px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
        }

        .qty-val {
            min-width: 26px;
            text-align: center;
            font-size: 15px;
            font-weight: 800;
        }

        .add-cart-submit {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 12px;
            background-color: var(--brand-red);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .add-cart-submit:hover {
            background-color: #D12221;
        }

        /* ==================== 8. 장바구니 드로어 & 주문완료 화면 ==================== */
        .cart-item-card {
            background-color: #FAFAFB;
            border: 1px solid #ECECEF;
            border-radius: 14px;
            padding: 13px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .cart-summary-box {
            background-color: var(--brand-red-soft);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
            font-size: 13px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row.total {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--brand-red-border);
            font-size: 16px;
            font-weight: 900;
            color: var(--brand-red);
            margin-bottom: 0;
        }

        /* 토스트 알림 */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 100;
            background-color: rgba(25, 25, 25, 0.94);
            color: #FFFFFF;
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>

    /* ==================== 3. 4단계 고추 맵기 아이콘 렌더링 ==================== */
    function renderSpiceChilis(level) {
        if (level === 0) {
            return `<span class="mild-label">달콤 별미</span>`;
        }
        let html = '<div class="spice-meter" title="맵기 ' + level + '단계">';
        for (let i = 1; i <= 4; i++) {
            const active = i <= level;
            const color = active ? '#E62E2D' : '#DCDCE0';
            html += `
                <svg width="13" height="13" viewBox="0 0 24 24" fill="${color}">
                    <path d="M17.5 3C16.2 3 15.1 3.8 14.7 5C12.2 5.4 9.5 7.4 7.7 10.6C5.5 14.5 5.2 18.8 6.8 20.4C7.5 21.1 8.6 21.1 9.8 20.6C12.7 19.3 15.6 16.4 17.4 12.6C18.8 9.6 19.1 6.7 18.4 4.8C19.2 4.3 19.6 3.3 19 2.6C18.6 2.8 18 3 17.5 3Z"/>
                </svg>
            `;
        }
        html += '</div>';
        return html;
    }

    /* ==================== 4. 상태 변수 (필터, 쿠폰, 장바구니, 모달) ==================== */
    let selectedCategory = 'all';
    let couponClaimed = false;
    let cart = [];

    let currentDetailMenu = null;
    let detailState = {
        tteok: '쫀득 밀떡 (기본)',
        tteokPrice: 0,
        spice: 2,
        toppings: [],
        qty: 1
    };

    /* ==================== 5. 메뉴 리스트 필터링 및 정렬 렌더링 ==================== */
    function selectCategory(cat) {
        selectedCategory = cat;
        document.querySelectorAll('.cat-pill').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === cat);
        });
        renderMenuList();
    }

    function resetFilters() {
        selectCategory('all');
        document.getElementById('sort-select').value = 'popular';
        renderMenuList();
        showToast('전체 이색 메뉴 목록을 표시합니다.');
    }

    function renderMenuList() {
        const sortBy = document.getElementById('sort-select').value;
        let list = selectedCategory === 'all'
            ? [...uniqueMenus]
            : uniqueMenus.filter(m => m.category === selectedCategory);

        if (sortBy === 'spicy') {
            list.sort((a, b) => b.spiceLevel - a.spiceLevel);
        } else if (sortBy === 'priceAsc') {
            list.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'reviews') {
            list.sort((a, b) => b.reviews - a.reviews);
        }

        document.getElementById('menu-count').textContent = list.length;

        const container = document.getElementById('menu-list-container');
        container.innerHTML = list.map((menu, index) => `
            <article class="menu-card ${menu.featured && selectedCategory === 'all' && index === 0 ? 'featured' : ''}" onclick="openDetailSheet('${menu.id}')">
                <div class="thumb-box">
                    <span class="thumb-badge">${menu.badge}</span>
                    ${getCustomFoodSVG(menu.svgKey, 66)}
                </div>

                <div class="card-body">
                    <div>
                        <div class="card-top-meta">
                            <span class="cat-tag">${menu.category}</span>
                            ${renderSpiceChilis(menu.spiceLevel)}
                        </div>
                        <h3 class="card-title">${menu.title}</h3>
                        <p class="card-desc">${menu.shortDesc}</p>
                        <div class="card-rating">
                            <span class="star">★</span>
                            <span>${menu.rating.toFixed(1)}</span>
                            <span class="reviews">(${menu.reviews.toLocaleString()})</span>
                        </div>
                    </div>

                    <div class="card-bottom-row">
                        <span class="card-price">${menu.price.toLocaleString()}원</span>
                        <button type="button" class="detail-cta-btn" onclick="event.stopPropagation(); openDetailSheet('${menu.id}')">
                            상세 / 담기
                        </button>
                    </div>
                </div>
            </article>
        `).join('');
    }

    /* ==================== 6. 시식 쿠폰 발급 & 카운트다운 타이머 ==================== */
    function claimCoupon() {
        if (couponClaimed) {
            showToast('이미 발급된 시식 쿠폰입니다. 15,000원 이상 주문 시 자동 적용돼요!');
            return;
        }
        couponClaimed = true;
        const btn = document.getElementById('coupon-btn');
        btn.classList.add('issued');
        btn.innerHTML = `<span>발급완료 ✓</span>`;
        showToast('🎉 2,000원 이색 신메뉴 시식 쿠폰이 발급되었습니다!');
    }

    // 배너 상단 실시간 타이머
    let remainingSeconds = 2 * 3600 + 45 * 60 + 2;
    setInterval(() => {
        if (remainingSeconds > 0) remainingSeconds--;
        const h = String(Math.floor(remainingSeconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, '0');
        const s = String(remainingSeconds % 60).padStart(2, '0');
        const timerEl = document.getElementById('promo-timer');
        if (timerEl) timerEl.textContent = `${h}:${m}:${s}`;
    }, 1000);

    /* ==================== 7. 메뉴 상세정보 바텀 시트 로직 ==================== */
    const tteokOptions = [
        { name: '쫀득 밀떡 (기본)', price: 0 },

        { name: '롱 누들떡', price: 1000 }

    const spiceOptions = [

        { level: 2, label: '2단계 설렘 매콤맛 (황금 밸런스)' },
        { level: 3, label: '3단계 입덕완료맛 (시그니처 매운맛)' },

    const extraToppings = [
        { name: '눈꽃 모짜렐라 치즈', price: 2000 },
        { name: '직화 한우 대창 추가', price: 4500 },
        { name: '블랙 트러플 오일 추가', price: 1500 },
        { name: '바삭 꿔바로우 4조각', price: 3000 }

        detailState = {

            tteokPrice: 0,
            spice: menu.spiceLevel === 0 ? 0 : menu.spiceLevel,
            toppings: [],
            qty: 1
        };

        document.getElementById('detail-qty').textContent = '1';

        const body = document.getElementById('detail-sheet-body');
        body.innerHTML = `
            <div class="sheet-hero-visual">
                <span class="sheet-visual-tag">${menu.badge}</span>
                ${getCustomFoodSVG(menu.svgKey, 118)}
            </div>

            <div class="sheet-title-row">
                <span class="cat-tag">${menu.category}</span>

                <div class="option-header">

                    <span class="req-badge">필수</span>

                    <div class="option-item selected">
                        <span class="option-left">
                            <input type="radio" checked disabled>
                            <span>🍯 달콤 고소 고정 (맵지 않은 디저트 별미)</span>

                ` : `

                                    <span>${sp.label}</span>

                                <span class="option-price">${sp.level === menu.spiceLevel ? '추천' : '+0원'}</span>

                <div class="option-header">

    }

    function selectTteokOption(name, price, el) {
        detailState.tteok = name;
        detailState.tteokPrice = price;
        el.parentElement.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('input').checked = false;
        });
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        updateDetailTotalButton();
    }

    function selectSpiceOption(level, el) {
        detailState.spice = level;
        el.parentElement.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('input').checked = false;
        });
        el.classList.add('selected');
        el.querySelector('input').checked = true;
    }

    function toggleExtraTopping(name, price, el) {
        // label 내부 클릭 시 checkbox 토글 보정
        setTimeout(() => {
            const cb = el.querySelector('input');
            if (cb.checked) {
                el.classList.add('selected');
                if (!detailState.toppings.some(t => t.name === name)) {
                    detailState.toppings.push({ name, price });
                }
            } else {
                el.classList.remove('selected');
                detailState.toppings = detailState.toppings.filter(t => t.name !== name);
            }
            updateDetailTotalButton();
        }, 0);
    }

    function changeDetailQty(delta) {
        const next = detailState.qty + delta;
        if (next < 1 || next > 20) return;
        detailState.qty = next;
        document.getElementById('detail-qty').textContent = String(next);
        updateDetailTotalButton();
    }

    function calcDetailUnitPrice() {
        if (!currentDetailMenu) return 0;
        const topSum = detailState.toppings.reduce((acc, t) => acc + t.price, 0);
        return currentDetailMenu.price + detailState.tteokPrice + topSum;
    }

    function updateDetailTotalButton() {
        const total = calcDetailUnitPrice() * detailState.qty;
        document.getElementById('detail-add-btn').textContent = `${total.toLocaleString()}원 장바구니 담기`;
    }

    function closeDetailSheet() {
        document.getElementById('detail-backdrop').classList.remove('open');
        document.body.style.overflow = '';
    }

    function closeDetailOnBackdrop(e) {
        if (e.target.id === 'detail-backdrop') closeDetailSheet();
    }

    /* ==================== 8. 장바구니 담기, 쿠폰 할인, 주문 완료 시뮬레이션 ==================== */
    function submitDetailToCart() {
        if (!currentDetailMenu) return;
        const unitPrice = calcDetailUnitPrice();
        const spiceText = detailState.spice === 0 ? '달콤 별미' : `맵기 ${detailState.spice}단계`;
        const topText = detailState.toppings.length > 0
            ? ' · 추가: ' + detailState.toppings.map(t => t.name).join(', ')
            : '';

        cart.push({
            uid: Date.now(),
            title: currentDetailMenu.title,
            optionText: `${detailState.tteok} · ${spiceText}${topText}`,
            qty: detailState.qty,
            unitPrice: unitPrice
        });

        updateCartBadge();
        closeDetailSheet();
        showToast(`🛒 '${currentDetailMenu.title}' 장바구니에 담았습니다!`);
    }

    function updateCartBadge() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('header-cart-badge').textContent = totalQty;
    }

    function openCartSheet() {
        renderCartSheet();
        document.getElementById('cart-backdrop').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeCartSheet() {
        document.getElementById('cart-backdrop').classList.remove('open');
        document.body.style.overflow = '';
    }

    function closeCartOnBackdrop(e) {
        if (e.target.id === 'cart-backdrop') closeCartSheet();
    }

    function removeCartItem(uid) {
        cart = cart.filter(item => item.uid !== uid);
        updateCartBadge();
        renderCartSheet();
    }

    function renderCartSheet() {
        const body = document.getElementById('cart-sheet-body');
        const submitBtn = document.getElementById('order-submit-btn');

        if (cart.length === 0) {
            body.innerHTML = `
                <h2 class="sheet-menu-title" style="margin-bottom:16px;">장바구니</h2>
                <div style="text-align:center; padding:48px 16px; color:#8E8E93;">
                    <div style="font-size:38px; margin-bottom:10px;">🥘</div>
                    <p style="font-size:14px; font-weight:700; color:#555558;">장바구니가 비어있습니다.</p>
                    <p style="font-size:12.5px; margin-top:4px;">입덕볶이의 독특한 시그니처 메뉴를 담아보세요!</p>
                </div>
            `;
            submitBtn.textContent = '메뉴 담으러 가기';
            submitBtn.onclick = closeCartSheet;
            return;
        }

        const subtotal = cart.reduce((sum, item) => sum + item.unitPrice * item.qty, 0);
        const eligibleCoupon = couponClaimed && subtotal >= 15000;
        const discount = eligibleCoupon ? 2000 : 0;
        const finalPrice = subtotal - discount;

        body.innerHTML = `
            <h2 class="sheet-menu-title" style="margin-bottom:14px;">주문 내역 (${cart.reduce((s, i) => s + i.qty, 0)}개)</h2>
            <div>
                ${cart.map(item => `
                    <div class="cart-item-card">
                        <div>
                            <div style="font-size:14px; font-weight:800; color:#191919;">${item.title} × ${item.qty}</div>
                            <div style="font-size:12px; color:#767678; margin-top:3px;">${item.optionText}</div>
                            <div style="font-size:14px; font-weight:800; color:#191919; margin-top:6px;">
                                ${(item.unitPrice * item.qty).toLocaleString()}원
                            </div>
                        </div>
                        <button onclick="removeCartItem(${item.uid})" style="border:none; background:transparent; color:#8E8E93; font-size:12px; font-weight:700; cursor:pointer;">삭제</button>
                    </div>
                `).join('')}
            </div>

            <div class="cart-summary-box">
                <div class="summary-row">
                    <span>총 상품 금액</span>
                    <strong>${subtotal.toLocaleString()}원</strong>
                </div>
                <div class="summary-row">
                    <span>시식 쿠폰 할인 ${!couponClaimed ? '(배너에서 쿠폰받기 가능)' : subtotal < 15000 ? '(15,000원 이상 적용)' : '(즉시 적용됨)'}</span>
                    <strong style="color:#E62E2D;">-${discount.toLocaleString()}원</strong>
                </div>
                <div class="summary-row total">
                    <span>최종 결제 예정 금액</span>
                    <span>${finalPrice.toLocaleString()}원</span>
                </div>
            </div>
        `;

        submitBtn.textContent = `${finalPrice.toLocaleString()}원 주문하기`;
        submitBtn.onclick = () => completeOrderSimulation(finalPrice);
    }

    function completeOrderSimulation(finalPrice) {
        const body = document.getElementById('cart-sheet-body');
        const submitBtn = document.getElementById('order-submit-btn');

        cart = [];
        updateCartBadge();

        body.innerHTML = `
            <div style="text-align:center; padding:36px 16px;">
                <div style="width:60px; height:60px; border-radius:50%; background:#FFF0F1; color:#E62E2D; font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;">🔥</div>
                <h2 style="font-size:20px; font-weight:900; color:#191919; margin-bottom:6px;">주문이 정상 접수되었습니다!</h2>
                <p style="font-size:13.5px; color:#555558; line-height:1.5;">
                    결제 금액 <strong>${finalPrice.toLocaleString()}원</strong><br>
                    선택하신 떡과 맵기에 맞춰 지금 바로 조리를 시작합니다.
                </p>
            </div>
        `;
        submitBtn.textContent = '확인';
        submitBtn.onclick = closeCartSheet;
    }

    /* ==================== 9. 토스트 알림 & 초기화 ==================== */
    let toastTimer;
    function showToast(message) {
        const toast = document.getElementById('toast-msg');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2600);
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderMenuList();
    });
</script>
</body>
</html>
